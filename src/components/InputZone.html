<script total>
	exports.id = 'inputzone';
	exports.name = 'InputZone';
	exports.icon = 'ti ti-code';
	exports.author = 'Acre Security';
	exports.version = '1';
	exports.group = 'Nexus';
	exports.config = {
		topic: 'acre/config/InputZone',
		selectedInput: null,
	};
	exports.inputs = [{ id: 'topics', name: 'topics' }];
	exports.outputs = [{ id: 'output', name: 'Output' }];

	exports.make = function(instance, config) {
		var inputZones = [];
		var statusMap = new Map();

		instance.message = function($) {
			var data = $.data;
			var topic = $.data.topic;
			var payload = $.data.message;

			if (!topic || !payload)
				return;

			var parts = topic.split('/');
			var nexId = parts.pop();

			if (topic.startsWith('acre/status/InputZone')) {
				statusMap.set(nexId, payload);
				const inputConfig = inputZones.find(i => i.id === nexId);
				if (inputConfig) {
					inputConfig.status = payload;
				}
			} else if (topic.startsWith('acre/config/InputZone') && !inputZones.find(i => i.id === payload.NexId)) {
				var status = statusMap.get(nexId)
				inputZones.push({
					id: payload.NexId,
					name: payload.Name,
					displayName: payload.Name + ' (' + payload.NexId + ')',
					config: payload,
					status,
				});
			}
		};

		instance.configure = function(config) {
			var selectedInput = inputZones.find(i => i.id === config.selectedInput);
			instance.status(selectedInput);
		};

		instance.call = function(_, callback) {
			callback({inputZones, statusMap});
		}

		instance.configure(config);

	};

	exports.call = function(data, answer) {
		// answer(inputZones);
	};

</script>
